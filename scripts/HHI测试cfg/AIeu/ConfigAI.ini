# comment format
[Update]
Update="Update.txt | ../Update.txt | ../../Update.txt"

[Main]
jobfile = "jobs.txt"
logfile="log.csv"
ctc2017 = [../AJ2017.csv]
spaceEfficiency=1
sourcedir = [/gpfs01/home/luhengjia/zyf/sdrscc.yuv/]
order = [1]

encoderRuns = [1]
decoderRuns = [10]

enableFrameRdOutput = [false]
enableMemUpdate = [true]
enableParcatDecOutput = [false]

[Cmds]
encoder = [/gpfs01/home/luhengjia/zyf_HHI/test_europe_5x/test/benchmark/EncoderApp (cfg) -c cfg/per-sequence/(name).cfg -i (file) (skip) (frames) (ip) -q (qp) (qpif) -b (name)_(qp)(seg).bin -o /dev/null --PrintHexPSNR=1 --SEIDecodedPictureHash=1 > (name)_(qp)(seg).log]
decoder = [/gpfs01/home/luhengjia/zyf_HHI/test_europe_5x/test/benchmark/DecoderApp -b (name)_(qp)(seg).bin >> (name)_(qp)(seg).log]
parcat = [/gpfs01/home/luhengjia/zyf_HHI/test_europe_5x/test/benchmark/parcat]

[Global]
qps=[22 27 32 37]
segmentLength=32 #for AI test, segmentLength is limited as "times of 8" instead of limited to "times of IntraPeriod", refer to JVET-B0036
QPIncrementFrame=[-1 -1 -1 -1]

